[package]
name = "silentswim-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Interactive mathematical studio for the SilentSwim research demo"
license = "MIT"
repository = "https://github.com/hama6767/silentswim_demo"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_plot = "=0.34.0"
image = { version = "0.25", default-features = false, features = ["png"] }
nalgebra = { version = "0.34", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
lto = "thin"
strip = true

